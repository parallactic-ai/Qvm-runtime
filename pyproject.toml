[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qvm-runtime"
version = "0.2.0"
description = "A clean, beginner-friendly Quantum Runtime built on PennyLane"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jesiel" }
]
dependencies = [
    "pennylane>=0.40.0",
    "numpy>=1.26.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
qvm = "qvm.cli:main"

[project.urls]
Homepage = "https://github.com/parallactic-ai/Qvm-runtime"

[tool.hatch.build.targets.wheel]
packages = ["qvm"]

[tool.ruff]
line-length = 100
