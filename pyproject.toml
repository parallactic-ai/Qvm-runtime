[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qvm-runtime"
version = "0.1.0"
description = "Minimal Quantum Runtime (QVM) - Phase 1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jesiel" }
]
dependencies = [
    "pennylane>=0.40.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/your-org/qvm"

[tool.hatch.build.targets.wheel]
packages = ["qvm"]

[tool.ruff]
line-length = 100
