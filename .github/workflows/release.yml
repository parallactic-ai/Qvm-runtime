name: release

on:
  push:
    tags:
      - "v*"

# Required for PyPI Trusted Publishing (OIDC).
permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qvm-runtime
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify the wheel installs cleanly
        run: |
          python -m venv /tmp/install-check
          /tmp/install-check/bin/pip install --upgrade pip
          /tmp/install-check/bin/pip install dist/*.whl
          /tmp/install-check/bin/python -c "from qvm import QuantumRuntime; print(QuantumRuntime())"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
